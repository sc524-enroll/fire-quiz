<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>火險題庫 練習系統</title>
<style>
  :root{
    --bg:#f4f1ea;
    --card:#ffffff;
    --ink:#2b2620;
    --muted:#847c6d;
    --accent:#a8571f;
    --accent-dark:#7d3f13;
    --line:#e4ddce;
    --correct:#3f7d52;
    --correct-bg:#e8f3ea;
    --wrong:#b3462c;
    --wrong-bg:#fbebe6;
    --chip:#f3e6d8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",-apple-system,BlinkMacSystemFont,sans-serif;
    background:
      radial-gradient(circle at 10% 10%, rgba(168,87,31,0.06), transparent 40%),
      radial-gradient(circle at 90% 90%, rgba(168,87,31,0.06), transparent 40%),
      var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 16px 60px;
  }
  .wrap{
    width:100%;
    max-width:760px;
  }
  header{
    text-align:center;
    margin-bottom:24px;
  }
  header h1{
    font-size:1.5rem;
    margin:0 0 4px;
    letter-spacing:1px;
  }
  header p{
    margin:0;
    color:var(--muted);
    font-size:0.9rem;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:28px;
    box-shadow:0 10px 30px rgba(30,40,60,0.06);
  }
  .stat-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
    font-size:0.85rem;
    color:var(--muted);
    flex-wrap:wrap;
    gap:8px;
  }
  .stat-bar .badge{
    background:var(--chip);
    color:var(--accent-dark);
    padding:4px 12px;
    border-radius:999px;
    font-weight:600;
  }
  .progress-track{
    height:6px;
    border-radius:999px;
    background:var(--line);
    overflow:hidden;
    margin-bottom:20px;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    transition:width .3s ease;
  }
  h2.qtitle{
    font-size:1.1rem;
    line-height:1.7;
    white-space:pre-wrap;
    margin:0 0 20px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:18px;
  }
  .opt{
    text-align:left;
    padding:14px 16px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:#fdfcf9;
    cursor:pointer;
    font-size:0.98rem;
    color:var(--ink);
    transition:border-color .15s, background .15s, transform .1s;
    display:flex;
    gap:10px;
    align-items:flex-start;
  }
  .opt:hover:not(:disabled){
    border-color:var(--accent);
    background:#f3f8fb;
  }
  .opt:active:not(:disabled){transform:scale(0.99);}
  .opt .num{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--chip);
    color:var(--accent-dark);
    font-size:0.8rem;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;
  }
  .opt:disabled{cursor:default;}
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
  }
  .opt.correct .num{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
  }
  .opt.wrong .num{background:var(--wrong);color:#fff;}
  .opt.dim{opacity:0.55;}

  .feedback{
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:18px;
    font-size:0.95rem;
    line-height:1.6;
  }
  .feedback.correct{background:var(--correct-bg);color:var(--correct);}
  .feedback.wrong{background:var(--wrong-bg);color:var(--wrong);}
  .feedback .verdict{font-weight:700;font-size:1.05rem;display:block;margin-bottom:4px;}
  .feedback .exp{color:var(--ink);opacity:0.8;font-size:0.88rem;margin-top:8px;white-space:pre-wrap;}

  .actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  button.btn{
    flex:1 1 auto;
    padding:13px 18px;
    border-radius:12px;
    border:none;
    font-size:0.95rem;
    font-weight:600;
    cursor:pointer;
    transition:filter .15s, transform .1s;
  }
  button.btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-secondary{background:var(--chip);color:var(--accent-dark);}
  .btn-secondary:hover{filter:brightness(0.97);}
  .btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent-dark);}
  button.btn:disabled{opacity:0.4;cursor:not-allowed;}

  .mode-tabs{
    display:flex;
    gap:8px;
    margin-bottom:22px;
    background:var(--chip);
    padding:4px;
    border-radius:12px;
  }
  .mode-tabs button{
    flex:1;
    padding:10px 12px;
    border:none;
    border-radius:9px;
    background:transparent;
    color:var(--accent-dark);
    font-size:0.9rem;
    font-weight:600;
    cursor:pointer;
  }
  .mode-tabs button.active{
    background:#fff;
    box-shadow:0 2px 6px rgba(30,40,60,0.08);
  }

  .setup-field{margin-bottom:18px;}
  .setup-field label{display:block;font-size:0.9rem;color:var(--muted);margin-bottom:8px;}
  .setup-field input[type=number]{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1.5px solid var(--line);
    font-size:1rem;
    font-family:inherit;
  }
  .setup-hint{font-size:0.8rem;color:var(--muted);margin-top:6px;}
  .quick-picks{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .quick-picks button{
    padding:6px 12px;
    border-radius:999px;
    border:1px solid var(--line);
    background:#fff;
    font-size:0.8rem;
    cursor:pointer;
    color:var(--accent-dark);
  }
  .quick-picks button:hover{border-color:var(--accent);}

  .topic-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .topic-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 16px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:#fdfcf9;
    cursor:pointer;
    text-align:left;
  }
  .topic-item:hover{border-color:var(--accent);background:#f3f8fb;}
  .topic-item .tname{font-size:0.95rem;font-weight:600;}
  .topic-item .tcount{font-size:0.78rem;color:var(--muted);margin-top:2px;}
  .topic-item .tarrow{color:var(--accent);font-size:1.1rem;}

  .summary-row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:0.92rem;
  }
  .summary-row:last-child{border-bottom:none;}
  .mode-banner{
    font-size:0.8rem;
    background:#e4edf3;
    color:var(--accent-dark);
    padding:6px 12px;
    border-radius:999px;
    display:inline-block;
    margin-bottom:14px;
    font-weight:600;
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:0.78rem;
    margin-top:24px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>火險題庫 · 練習系統</h1>
    <p>共 <span id="totalCount">0</span> 題，可依題號或主題開始作答</p>
  </header>

  <div class="card" id="app"></div>
  <footer>作答紀錄僅保存在本次瀏覽階段，重新整理頁面將會重置。</footer>
</div>

<script>

": ["50%", "60%", "80%", "90%"], "ans": 3, "topic": "商業火災保險附加條款", "exp": "為原則，但最高不得超過100%"}, {"id": 63, "q": "依「住宅火災及地震基本保險」附加之「颱風及洪水險」之約定，保險標的的物置存於2樓以上者，其費率按其基本費率之", "opts": ["50%", "60%", "70%", "80%"], "ans": 1, "topic": "商業火災保險附加條款", "exp": "計算"}, {"id": 64, "q": "當颱風來襲時，下列何種原因所致保險標的的物之毀損或滅失，非屬「住宅火災及地震基本保險」或「商業火災保險」附加之「颱風及洪水險」之承保範圍？", "opts": ["河川氾濫", "海水倒灌", "土石流", "水壩崩潰造成水災"], "ans": 3, "topic": "商業火災保險附加條款", "exp": null}, {"id": 65, "q": "依「住宅火災及地震基本保險」或「商業火災保險」附加之「颱風及洪水險」之約定，因颱風引起", "opts": ["海潮氾濫", "河川、水道、湖泊之水位暴漲氾濫", "水庫、水壩崩岸崩潰", "地層下陷、山崩或土石流"], "ans": 4, "topic": "商業火災保險附加條款", "exp": "，所致保險標的的物之毀損或滅失，保險人不負賠償責任"}, {"id": 66, "q": "「住宅火災及地震基本保險」或「商業火災保險」附加之「颱風及洪水險」，明訂洪水退去", "opts": ["168小時", "72小時", "48小時", "24小時"], "ans": 1, "topic": "商業火災保險附加條款", "exp": "後再度發生洪水時視為另一次事故"}, {"id": 67, "q": "依「住宅地震保險危險分散機制實施辦法」之規定，地震事故在連續", "opts": ["24小時", "48小時", "72小時", "168小時"], "ans": 4, "topic": "商業火災保險附加條款", "exp": "內發生二次以上時，視為同一次地震事故"}, {"id": 68, "q": "依商業火災保險附加條款(S2)「保險金額自動增加條款」之約定，保險人對保險標的的物（貨物除外）的變動、增加或改良致實際價值增加者，保險公司均自動承保，惟以不超過各項保險標的的物金額百分之", "opts": ["5%", "10%", "20%", "無上限"], "ans": 2, "topic": "商業火災保險附加條款", "exp": null}, {"id": 69, "q": "下列何者非「商業火災保險核保技術調整係數」之加、減費項目？", "opts": ["損失率", "消防設備", "S2附加條款加費", "損害防阻"], "ans": 1, "topic": "商業火災保險附加條款", "exp": null}, {"id": 70, "q": "投保商業火災保險，倘加繳保費加保「專業費用附加條款」，則保險公司對於所承保之建築物、營業裝修或機器設備因保險事故發生遭受損失後，為回復原狀所必需且合理之專業費用亦負賠償之。該費用包括", "opts": ["建築師費用", "會計師、律師費用", "鑑定費用", "以上皆是"], "ans": 4, "topic": "商業火災保險附加條款", "exp": null}, {"id": 71, "q": "依火災保險保險費之規定，一個工廠內，停止其全部製造工作程序，連續", "opts": ["十日", "二十日", "三十日", "六十日"], "ans": 3, "topic": "商業火災保險附加條款", "exp": "以上者，得適用工廠停工費率"}, {"id": 72, "q": "依「住宅火災及地震基本保險」或「商業火災保險」附加之「自動消防裝置滲漏險」之約定，下列何種原因導致自動消防裝置意外滲漏，所致保險標的的物之損失，保險人不負賠償責任？", "opts": ["修繕或加建建築物", "修繕、改裝、擴充或遷移自動消防裝置", "冰凍", "以上皆是"], "ans": 4, "topic": "商業火災保險附加條款", "exp": null}, {"id": 73, "q": "商業火災保險所稱「巨大保額業務」之認定標準，係指同一保險標的的物地址之火險財產總保險金額須新台幣", "opts": ["三十億元", "四十億元", "五十億元", "一百億元"], "ans": 1, "topic": "巨大保額與在台跨國外資企業", "exp": " 85, "q": "「住宅火災及地震基本保險」條款中，對被保險人之敘述何者為錯誤？", "opts": ["對承保住宅建築物的所有權有保險利益", "負有交付保險費義務之人", "享有保險賠償請求權之人", "以上皆非"], "ans": 2, "topic": "住宅火災及地震基本保險－共同條款", "exp": "其實這題主要是考：關於被保險人的敘述何者為錯誤？選項(2)負有交付保險費義務之人為要保人。"}, {"id": 86, "q": "依「住宅火災及地震基本保險」條款之約定，下列何者屬於要保人或被保險人於保險期間內應履行之通知義務？", "opts": ["保險標的的物使用性質變更", "保險標的的物另向其他保險公司投保相同之保險", "置存保險標的的物之建築物業已改建", "以上皆是"], "ans": 4, "topic": "住宅火災及地震基本保險－共同條款", "exp": "選項(1)、(2)、(3)的情況都需通知保險公司。"}, {"id": 87, "q": "依「住宅火災及地震基本保險」條款之約定，保險標的的物因讓渡而所有權移轉時，該保險單仍於", "opts": ["三個月內", "二個月內", "一個月內", "到期日前"], "ans": 1, "topic": "住宅火災及地震基本保險－共同條款", "exp": "繼續有效"}, {"id": 88, "q": "徐先生之房屋投保「住宅火災及地震基本保險」，於保險期間剩餘二個月前，將房屋過戶給其女兒，則保單之效力如何？", "opts": ["自過戶轉讓時即行終止", "三個月內繼續有效", "保險期間剩餘二個月內繼續有效", "以上皆非"], "ans": 3, "topic": "住宅火災及地震基本保險－共同條款", "exp": null}, {"id": 89, "q": "火災保險單在何種情況下依短期費率計算保險費？", "opts": ["保險期間滿一年者", "當保險人提出終止契約時", "當要保人提出終止契約時", "當保險契約所定終止之情事發生時"], "ans": 3, "topic": "住宅火災及地震基本保險－共同條款", "exp": null}, {"id": 90, "q": "火災保險單以一年為期，保險期間如不足一年，或被保險人中途要求終止時，保險公司按", "opts": ["日數比例", "全年保費", "短期費率", "以上皆可"], "ans": 3, "topic": "住宅火災及地震基本保險－共同條款", "exp": "計收保險費。但承保標的的物為貨物時，其終止時按未到期日數比例計算"}, {"id": 91, "q": "一年期火災保險單，如因被保險人要求增加保險金額（貨物除外），其加費得按", "opts": ["未到期日數比例計算", "短期費率計算", "生效日起以全年計算", "以上均可"], "ans": 1, "topic": "住宅火災及地震基本保險－共同條款", "exp": null}, {"id": 92, "q": "被保險人投保「住宅火災及地震基本保險」後，某日不幸廚房發生小火災事故，被保險人於消防隊到達之前，使用家用型滅火器將火撲滅。試問保險公司對於該項滅火器消耗是否亦負賠償責任？", "opts": ["會賠償", "不能理賠", "視情況而定", "除經特別載明外，否則不負賠償責任"], "ans": 1, "topic": "住宅火災及地震基本保險－共同條款", "exp": "屬於損失擴大之防止。"}, {"id": 93, "q": "哪一項費用在住宅火災保險出險時不予賠償？", "opts": ["防止損失擴大費用", "殘餘物清除費用", "醫療費用", "臨時住宿費用"], "ans": 3, "topic": "住宅火災及地震基本保險－住宅火災保險", "exp": null}, {"id": 94, "q": "依「住宅火災及地震基本保險」條款約定，被保險人於「火災事故」發生後，建築物毀損不適合居住，於修復或重建期間，保險公司所補償之臨時住宿費用包括", "opts": ["暫住旅社所支出之合理且必需費用", "暫時租賃房屋所支出之合理且必需費用", "暫住親戚家所支出之合理且必需費用", "以上皆是"], "ans": 4, "topic": "住宅火災及地震基本保險－住宅火災保險", "exp": null}, {"id": 95, "q": "住宅火災保險，有關臨時住宿費用之賠償，下列敘述何者為錯誤的？", "opts": ["於修復或重建期間暫住旅社所支出之合理且必需費用", "僅保動產者不適用", "不受不足額保險比例分攤之限制", "臨時住宿費用與賠償金額合計超過保險金額時，以保險金額為限"], "ans": 4, "topic": "住宅火災及地震基本保險－住宅火災保險", "exp": null}, {"id": 96, "q": "「住宅火災及地震基本保險」之住宅火災保險，關於清除費用之賠付，何者有誤？", "opts": ["係賠償清除受損標的的物之殘餘物所生必要費用", "只賠償一次", "需受不足額保險比例分擔之限制", "與賠償金額合計不得超過保險金額"], "ans": 2, "topic": "住宅火災及地震基本保險－住宅火災保險", "exp": null}, {"id": 97, "q": "下列何者不屬於「住宅火災及地震基本保險」中住宅火災保險之承保危險事故，而須另行約定方式予以承保者？", "opts": ["航空器墜落", "機動車輛碰撞", "颱風及洪水", "意外事故所致之煙燻"], "ans": 3, "topic": "住宅火災及地震基本保險－住宅火災保險", "exp": "需保住宅火災及地震基本保險後加保颱風及洪水保險附加條款。"}, {"id": 98, "q": "下列何者屬於「住宅火災及地震基本保險」之住宅火災保險絕對不保的危險事故？", "opts": ["要保人或被保險人之故意行為", "火山爆發、地下發火", "由於烹飪或使用火爐、壁爐或香爐正常使用所產生之煙燻", "以上皆是"], "ans": 4, "topic": "住宅火災及地震基本保險－住宅火災保險", "exp": null}, {"id": 99, "q": "住宅建築物有下列何種情況時，不得投保住宅火災保險，而應按商業用建築物投保？", "opts": ["住宅的全部或一部分供辦公用", "住宅的全部或一部分供加工、製造用", "住宅的全部或一部分供營業用", "以上皆是"], "ans": 4, "topic": "住宅火災及地震基本保險－住宅火災保險", "exp": null}, {"id": 100, "q": "除經特別約定載明者外，「住宅火災及地震基本保險」標的的物中所指「建築物內動產」通常不包括？", "opts": ["鋼琴", "腳踏車", "汽車", "個人電腦"], "ans": 3, "topic": "住宅火災及地震基本保險－住宅火災保險", "exp": "此類題目因為項目太多了。建議用題目去記憶就好。「機動車輛及其零配件」屬於住火地震險中不保之動產（除非經特別約定載明）。"}, {"id": 101, "q": "「住宅火災及地震基本保險」所承保之「建築物內動產」項目中，並不包括被保險人家中之", "opts": ["沙發", "音響", "飼養寵物", "電視"], "ans": 3, "topic": "住宅火災及地震基本保險－住宅火災保險", "exp": "「各種動物或植物」屬於住火地震險中不保之動產。"}, {"id": 102, "q": "屬於「住宅火災及地震基本保險」之住宅火災保險不保之動產，但可特別約定加保者有", "opts": ["供加工、製造或營業用之機器", "寵物", "圖畫、古董", "植物"], "ans": 3, "topic": "住宅火災及地震基本保險－住宅火災保險", "exp": "此四項都是不保之動產，不過選項(3)的圖畫及古董如經特別約定載明承保，保險公司亦會負賠償責任。"}, {"id": 103, "q": "「住宅火災及地震基本保險」之住宅火災保險，其建築物保險金額之約定應以下列何者為基礎計算？", "opts": ["實際價值基礎", "重置成本基礎", "實際價值或重置成本基礎", "以上皆非"], "ans": 2, "topic": "住宅火災及地震基本保險－住宅火災保險", "exp": null}, {"id": 104, "q": "投保住宅火災保險時，其建築物的適當保額應如何計算方為妥適？", "opts": ["依房屋的購買總價投保", "依產險公會「台灣地區住宅類建築造價參考表」計算建築物本體造價總額及裝潢總價投保", "依要保人或被保險人向銀行辦理抵押貸款的金額投保", "依要保人或被保險人向銀行抵押貸款之金額扣除土地價值後之餘額投保"], "ans": 2, "topic": "住宅火災及地震基本保險－住宅火災保險", "exp": null}, {"id": 105, "q": "下列哪一項不屬於產險公會所編製之「台灣地區住宅類建築造價參考表」所稱建築物之重置成本估算因素？", "opts": ["使用面積", "地區及總樓層數", "建造年份", "裝潢總價"], "ans": 3, "topic": "住宅火災及地震基本保險－住宅火災保險", "exp": null}, {"id": 106, "q": "林小姐之房屋座落於台中市，為12層樓鋼筋混凝土造建築，於92年建造完成使用，計有50坪，當時買價為8,500,000元，又其室內今年重新裝潢，裝潢費每坪20,000元，依產險公會之「台灣地區住宅類建築造價參考表」，該建築物本體每坪造價為69,000元，林小姐擬為其房屋及裝潢投保住宅火災保險，保險金額應以", "opts": ["3,450,000元", "4,450,000元", "8,500,000元", "9,500,000元"], "ans": 2, "topic": "住宅火災及地震基本保險－住宅火災保險", "exp": "房屋69,000(元/坪)*50(坪)+裝潢20,000(元/坪)*50(坪)=4,450,000"}, {"id": 107, "q": "依住宅火災保險條款約定，其承保建築物之火險保額已達該建築物出險時之重置成本", "opts": ["60%", "70%", "80%", "90%"], "ans": 1, "topic": "住宅火災及地震基本保險－住宅火災保險", "exp": "時即視為足額投保，不受不足額比例分擔之限制"}, {"id": 108, "q": "某甲將其房屋投保「住宅火災及地震基本保險」，火險保額為80萬元，四個月後發生火災損失50萬元，其房屋之重置成本100萬元，則保險公司對建築物損失應賠付多少？", "opts": ["36萬元", "40萬元", "45萬元", "50萬元"], "ans": 4, "topic": "住宅火災及地震基本保險－住宅火災保險", "exp": "住宅保險保額超過重置成本60%，視為足額保險，所以損失50萬就賠50萬，但最高不得超過額80萬。"}, {"id": 109, "q": "住宅建築物出險時其重置成本為100萬元，倘要保人在不了解的情況下向保險公司投保住宅火災保險120萬元，如部份保險標的的物遭受火災損失25萬元，則被保險人可獲得", "opts": ["15萬元", "20萬元", "25萬元", "30萬元"], "ans": 3, "topic": "住宅火災及地震基本保險－住宅火災保險", "exp": "之賠償"}, {"id": 110, "q": "依「住宅火災及地震基本保險」之保單條款之約定，若建築物連續", "opts": ["三十日", "四十五日", "六十日", "九十日"], "ans": 3, "topic": "住宅火災及地震基本保險－住宅火災保險", "exp": "以上無人看管或使用時，即視為「空屋」"}, {"id": 111, "q": "張三的房屋投保「住宅火災及地震基本保險」，於保險期間使用爐火不慎引發火災，並延燒至鄰屋，致鄰屋住戶遭受體傷、死亡或財損，則張三的保險公司對下列哪項損失不負賠償責任？", "opts": ["張三房屋的火災損失", "張三的體傷或死亡", "鄰屋的財物損失", "鄰屋住戶的體傷或死亡"], "ans": 2, "topic": "住宅火災及地震基本保險－住宅第三人責任基本保險", "exp": null}, {"id": 112, "q": "「住宅火災及地震基本保險」之「住宅第三人責任基本保險」所稱之「第三人」是指", "opts": ["被保險人", "被保險人之配偶、家屬、同居人", "被保險人之受僱人", "前述(1)(2)(3)以外之人"], "ans": 4, "topic": "住宅火災及地震基本保險－住宅第三人責任基本保險", "exp": "第三人是指被保險人及其配偶、家屬、同居人、受僱人以外的人。"}, {"id": 113, "q": "王大同居住某公寓2樓，向A產險公司投保「住宅火災及地震基本保險」，於保險期間內王大同家發生火災，因消防水灌救，致居住在1樓的父親王老先生家的家具及電器遭到損壞，財物損失達60萬元，依「住宅第三人責任保險」，王老先生可獲得多少賠償金？", "opts": ["60萬元", "50萬元", "20萬元", "無法獲得賠償"], "ans": 4, "topic": "住宅火災及地震基本保險－住宅第三人責任基本保險", "exp": "王老先生是王大同的家人，並非第三人，所以無法獲得賠償。"}, {"id": 114, "q": "王大同居住某公寓2樓，向A產險公司投保「住宅火災及地震基本保險」，於保險期間內王大同家發生火災，因消防水灌救，致居住在1樓的李小明家的家具及電器遭到損壞，財物損失達30萬元，依該保單條款之規定，李小明的財物損失如何獲得王賠償？", "opts": ["李小明未投保「住宅火災及地震基本保險」，無法獲   if(state.setupTab === 'number'){
    const input = document.getElementById('startNum');
    app.querySelectorAll('.quick-picks button').forEach(b=>{
      b.addEventListener('click', ()=>{ input.value = b.dataset.n; });
    });
    document.getElementById('startBtn').addEventListener('click', ()=>{
      let n = parseInt(input.value, 10);
      if(isNaN(n) || n < 1) n = 1;
      if(n > QUESTIONS.length) n = QUESTIONS.length;
      state.startNum = n;
      state.order = QUESTIONS.slice(n-1).map(q=>q.id);
      state.roundLabel = `第 ${n} 題起`;
      beginRound();
    });
  } else {
    app.querySelectorAll('.topic-item').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = parseInt(btn.dataset.topic, 10);
        const topicName = TOPIC_ORDER[idx];
        state.order = QUESTIONS.filter(q => q.topic === topicName).map(q => q.id);
        state.roundLabel = topicName;
        beginRound();
      });
    });
  }
}

function beginRound(){
  state.pos = 0;
  state.wrongSet = new Set();
  state.inReview = false;
  state.selectedOpt = null;
  state.screen = 'question';
  render();
}

function currentQueueAndPos(){
  if(state.inReview){
    return { queue: state.reviewQueue, pos: state.reviewPos };
  }
  return { queue: state.order, pos: state.pos };
}

function currentQuestion(){
  const {queue, pos} = currentQueueAndPos();
  if(pos >= queue.length) return null;
  return byId[queue[pos]];
}

function renderQuestion(showFeedback){
  const q = currentQuestion();
  if(!q){ state.screen = 'roundDone'; return render(); }

  const {queue, pos} = currentQueueAndPos();
  const totalInQueue = queue.length;
  const progressPct = Math.round(((pos) / totalInQueue) * 100);

  let bannerHtml = `<div class="mode-banner">${state.inReview ? '複習模式 · ' : ''}${escapeHtml(state.roundLabel)}</div>`;

  let optsHtml = q.opts.map((opt, idx)=>{
    const optNum = idx+1;
    let cls = 'opt';
    let disabledAttr = '';
    if(showFeedback){
      disabledAttr = 'disabled';
      if(optNum === q.ans){
        cls += ' correct';
      } else if(optNum === state.selectedOpt){
        cls += ' wrong';
      } else {
        cls += ' dim';
      }
    }
    return `<button class="${cls}" data-opt="${optNum}" ${disabledAttr}>
        <span class="num">${optNum}</span><span>${escapeHtml(opt)}</span>
      </button>`;
  }).join('');

  let feedbackHtml = '';
  if(showFeedback){
    const wasCorrect = state.selectedOpt === q.ans;
    feedbackHtml = `<div class="feedback ${wasCorrect ? 'correct':'wrong'}">
        <span class="verdict">${wasCorrect ? '✓ 答對了！' : '✗ 答錯了，正確答案是 (' + q.ans + ') ' + escapeHtml(q.opts[q.ans-1])}</span>
        ${q.exp ? `<div class="exp">解析：${escapeHtml(q.exp)}</div>` : ''}
      </div>`;
  }

  let actionsHtml = '';
  if(showFeedback){
    const isLastInQueue = (pos+1) >= totalInQueue;
    const wrongCount = state.wrongSet.size;
    actionsHtml = `<div class="actions">
      <button class="btn btn-primary" id="nextBtn">${isLastInQueue ? '完成本回合' : '下一題 →'}</button>
      <button class="btn btn-secondary" id="reviewBtn" ${wrongCount===0 ? 'disabled':''}>複習本回合錯題（${wrongCount}）</button>
    </div>`;
  }

  app.innerHTML = `
    ${bannerHtml}
    <div class="stat-bar">
      <span>題號 <strong>${q.id}</strong>（${escapeHtml(q.topic)}）</span>
      <span class="badge">${state.inReview ? '複習進度' : '進度'} ${pos+1} / ${totalInQueue}</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
    <h2 class="qtitle">${escapeHtml(q.q)}</h2>
    <div class="options">${optsHtml}</div>
    ${feedbackHtml}
    ${actionsHtml}
  `;

  if(!showFeedback){
    app.querySelectorAll('.opt').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const chosen = parseInt(btn.dataset.opt, 10);
        state.selectedOpt = chosen;
        if(chosen !== q.ans){
          state.wrongSet.add(q.id);
        } else {
          if(state.inReview) state.wrongSet.delete(q.id);
        }
        state.screen = 'feedback';
        render();
      });
    });
  } else {
    const nextBtn = document.getElementById('nextBtn');
    if(nextBtn){
      nextBtn.addEventListener('click', ()=>{
        advance();
      });
    }
    const reviewBtn = document.getElementById('reviewBtn');
    if(reviewBtn){
      reviewBtn.addEventListener('click', ()=>{
        startReview();
      });
    }
  }
}

function advance(){
  if(state.inReview){
    state.reviewPos += 1;
    if(state.reviewPos >= state.reviewQueue.length){
      state.inReview = false;
      if(state.pos >= state.order.length){
        state.screen = 'roundDone';
      } else {
        state.screen = 'question';
      }
    } else {
      state.screen = 'question';
    }
  } else {
    state.pos += 1;
    if(state.pos >= state.order.length){
      state.screen = 'roundDone';
    } else {
      state.screen = 'question';
    }
  }
  state.selectedOpt = null;
  render();
}

function startReview(){
  if(state.wrongSet.size === 0) return;
  state.reviewQueue = Array.from(state.wrongSet);
  state.reviewPos = 0;
  state.inReview = true;
  state.selectedOpt = null;
  state.screen = 'question';
  render();
}

function renderRoundDone(){
  const wrongCount = state.wrongSet.size;
  const totalAnswered = state.order.length;
  app.innerHTML = `
    <div style="text-align:center;margin-bottom:20px;">
      <div style="font-size:2rem;margin-bottom:8px;">🎉</div>
      <h2 class="qtitle" style="text-align:center;">本回合作答完成！</h2>
      <div class="mode-banner">${escapeHtml(state.roundLabel)}</div>
    </div>
    <div class="summary-row"><span>作答題數（主回合）</span><strong>${totalAnswered}</strong></div>
    <div class="summary-row"><span>尚未答對的題目</span><strong style="color:${wrongCount>0?'var(--wrong)':'var(--correct)'}">${wrongCount}</strong></div>
    <div class="actions" style="margin-top:20px;">
      ${wrongCount>0 ? `<button class="btn btn-primary" id="reviewBtn2">複習錯題（${wrongCount}）</button>` : ''}
      <button class="btn ${wrongCount>0?'btn-secondary':'btn-primary'}" id="restartBtn">重新選擇題號/主題</button>
    </div>
  `;
  const reviewBtn2 = document.getElementById('reviewBtn2');
  if(reviewBtn2){
    reviewBtn2.addEventListener('click', startReview);
  }
  document.getElementById('restartBtn').addEventListener('click', ()=>{
    state = {
      screen:'setup', setupTab: state.setupTab, order:[], pos:0, wrongSet:new Set(),
      selectedOpt:null, reviewQueue:[], reviewPos:0,
      inReview:false, startNum: state.startNum, roundLabel: ''
    };
    render();
  });
}

function escapeHtml(str){
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
